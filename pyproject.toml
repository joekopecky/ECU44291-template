[project]
name = "ecu44291-project"
version = "0.1.0"
description = "ECU44291 Quantitative Macroeconomics term project"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pytest>=8.0",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
